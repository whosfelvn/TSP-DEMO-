<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4A2A7A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TSP Demo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@600;700;800&family=Red+Hat+Mono:wght@500;600&family=Red+Hat+Text:wght@400;500;600&display=swap" rel="stylesheet"><style id="tsp-style">
/* Layout: ops handbook app. Sticky header + left rail (desktop) / scrolling tab strip (phone); wayfinding-sign yellow reserved for location tags and signage. */
:root{
  --bg:#F5F3F8;--surface:#FFFFFF;--surface-2:#EEEAF3;--fg:#1D1626;--muted:#61586E;--line:#DCD5E4;
  --accent:#4A2A7A;--accent-ink:#FFFFFF;--plum:#8A1F5D;--sign:#F2B21C;--sign-ink:#17120B;--signdark:#2B2533;
  --ok:#2E7A4D;--warn:#B57514;--crit:#B3261E;--ok-bg:#E3F1E8;--warn-bg:#FBEFD9;--crit-bg:#F9E1DF;
  --shadow:0 1px 2px rgba(30,20,45,.06),0 6px 18px rgba(30,20,45,.06);
  --f-display:"Red Hat Display",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Red Hat Text",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Red Hat Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#130F18;--surface:#1C1723;--surface-2:#262030;--fg:#EEE8F5;--muted:#A69CB3;--line:#372E42;
  --accent:#BCA4EC;--accent-ink:#150E20;--plum:#E07AB2;--sign:#F2B21C;--sign-ink:#17120B;--signdark:#0E0B12;
  --ok:#62C68E;--warn:#E8AE4F;--crit:#F27A70;--ok-bg:#16301F;--warn-bg:#33270F;--crit-bg:#3A1714;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130F18;--surface:#1C1723;--surface-2:#262030;--fg:#EEE8F5;--muted:#A69CB3;--line:#372E42;
  --accent:#BCA4EC;--accent-ink:#150E20;--plum:#E07AB2;--sign:#F2B21C;--sign-ink:#17120B;--signdark:#0E0B12;
  --ok:#62C68E;--warn:#E8AE4F;--crit:#F27A70;--ok-bg:#16301F;--warn-bg:#33270F;--crit-bg:#3A1714;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.badge-t4{font-family:var(--f-display);font-weight:800;font-size:10.5px;line-height:1.05;letter-spacing:.04em;text-transform:uppercase;background:linear-gradient(135deg,var(--accent),var(--plum));color:#fff;padding:7px 8px;border-radius:6px;flex:none}
:root[data-theme="dark"] .badge-t4{color:#160e20}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge-t4{color:#160e20}}
.top-title{min-width:0;flex:1}
.top-title h1{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title .sub{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ref{font-family:var(--f-mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);padding:1px 6px;border-radius:4px;color:var(--fg)}
.ref.empty{color:var(--muted);border-style:dashed}
.top-actions{display:flex;gap:8px;align-items:center;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.on{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
.btn[disabled]{opacity:.5;cursor:default}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}
@media (max-width:640px){
  .top-in{padding-block:8px;gap:10px}
  .top-title h1{font-size:16.5px}
  .top-title .sub .ref.empty{display:none}
  .top-title .sub .ref:not(.empty)~.prog{display:none}
  .badge-t4{font-size:9.5px;padding:6px 7px}
}

/* shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:0;min-height:calc(100vh - 60px)}
.rail{border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,61px));align-self:start;height:calc(100vh - var(--toph,61px));overflow:auto}
.rail a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--fg);font-weight:500;font-size:14.5px}
.rail a:hover{background:var(--surface-2)}
.rail a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.rail .count{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;opacity:.75}
main{min-width:0;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.tabbar,.savebar{display:none}
.savebar[hidden]{display:none!important}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  main{padding-block:16px calc(140px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;padding:6px 2px;border:0;background:none;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600;border-radius:10px;cursor:pointer}
  .tabbar .ico{width:23px;height:23px}
  .tabbar [aria-current="page"]{color:var(--accent)}
  .tabbar [aria-current="page"] .ico{stroke-width:2.4}
  .savebar{display:flex;position:fixed;left:0;right:0;bottom:calc(63px + env(safe-area-inset-bottom,0px));z-index:24;gap:10px;align-items:center;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--warn-bg);border-top:1px solid color-mix(in srgb,var(--warn) 40%,transparent);font-weight:600;font-size:14.5px}
  .savebar .btn{padding:10px 16px;font-size:15px}
  .top-actions .btn.primary,.top-actions .status{display:none}
  .toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
}
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(15,10,20,.5)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding:6px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));max-height:85vh;overflow:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 8px}
.sheet a{display:flex;align-items:center;gap:14px;padding:14px 10px;border-radius:10px;text-decoration:none;color:var(--fg);font-weight:600;font-size:16px}
.sheet a .ico{width:22px;height:22px;color:var(--accent)}
.sheet a[aria-current="page"]{background:var(--surface-2)}
.sheet a .count{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}

/* page heads & sections */
.phead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;justify-content:space-between}
.phead h2{font-size:26px;font-weight:800;letter-spacing:-.01em}
.phead p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.edit-only{display:none!important}
.editing .edit-only{display:inline-flex!important}
.editing .edit-only.blk{display:block!important}
.empty-note{color:var(--muted);font-size:14px;padding:12px;border:1px dashed var(--line);border-radius:10px;text-align:center}

/* location tag = wayfinding sign */
.loc{display:inline-flex;align-items:center;gap:5px;background:var(--sign);color:var(--sign-ink);font-weight:600;font-size:11.5px;padding:2px 7px;border-radius:3px;white-space:nowrap}
.loc.dark{background:var(--signdark);color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.pill.on{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 35%,transparent);color:var(--ok)}
.team{font-family:var(--f-mono);font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:3px;letter-spacing:.03em}
.team.BC{background:color-mix(in srgb,var(--plum) 18%,transparent);color:var(--plum)}
.team.Ops{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.team.OR{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.team.Other{background:var(--surface-2);color:var(--muted)}

/* overview */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.proj{background:linear-gradient(150deg,var(--accent),var(--plum));color:#fff;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
:root[data-theme="dark"] .proj{color:#160e20}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .proj{color:#160e20}}
.proj::after{content:"";position:absolute;right:-40px;top:-30px;width:180px;height:180px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.10) 0 18px,transparent 18px 36px);transform:rotate(8deg);pointer-events:none}
.proj .eyebrow{color:inherit;opacity:.8}
.proj h2{font-size:28px;font-weight:800;line-height:1.1}
.proj dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 16px;margin:0}
.proj dt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.proj dd{margin:2px 0 0;font-weight:600;font-family:var(--f-mono);font-size:13.5px;word-break:break-word}
.proj dd.unset{opacity:.65;font-style:italic;font-family:var(--f-body);font-weight:500}
.proj .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:inherit}
.live{display:flex;flex-direction:column;gap:4px}
.live .big{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.qd{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--fg)}
.qd:hover{border-color:var(--accent)}
.qd .r{font-size:13px;font-weight:600;line-height:1.3}
.qd .n{font-family:var(--f-mono);font-size:14px;color:var(--accent);font-weight:600}
.notice{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 0;overflow:hidden}
.notice .bar{background:var(--muted);border-radius:0 3px 3px 0}
.notice.info .bar{background:var(--accent)}.notice.advisory .bar{background:var(--warn)}.notice.critical .bar{background:var(--crit)}
.notice h4{font-size:15px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.notice p{margin:4px 0 0;white-space:pre-line}
.lvl{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:3px;font-weight:600}
.lvl.info{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.lvl.advisory{background:var(--warn-bg);color:var(--warn)}
.lvl.critical{background:var(--crit-bg);color:var(--crit)}
.todo{display:flex;flex-direction:column;gap:2px}
.todo label{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-radius:6px;cursor:pointer}
.todo label:hover{background:var(--surface-2)}
.todo input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.todo .done{text-decoration:line-through;color:var(--muted)}
details.about summary{cursor:pointer;font-weight:600}
details.about p{max-width:68ch;margin:10px 0 0}

/* contacts */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px}
.search input{border:0;background:transparent;padding:10px 0;width:100%;outline:none;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .c{font-family:var(--f-mono);font-size:11px;opacity:.7;margin-left:4px}
.cgroup{display:flex;flex-direction:column;gap:8px}
.cgroup>h3{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;gap:8px;align-items:center;padding-top:6px}
.ct{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;align-items:center}
.ct-name{font-weight:700;font-size:15px;line-height:1.3}
.ct-role{font-size:13.5px;color:var(--muted);line-height:1.35}
.ct-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ct-esc{font-size:13px;color:var(--muted);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ct-esc a{font-family:var(--f-mono);font-weight:600;text-decoration:none}
.dialbox{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.dial{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-family:var(--f-mono);font-weight:600;font-size:14.5px;padding:8px 12px;border-radius:9px;white-space:nowrap}
.dial:hover{filter:brightness(1.08)}
.nophone{font-size:12.5px;color:var(--muted);font-style:italic}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--fg);flex:none}
.iconbtn:hover{background:var(--surface-2)}
@media (max-width:560px){.ct{grid-template-columns:minmax(0,1fr)}.dialbox{justify-content:flex-start}}

/* who's on */
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.area{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.area-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.area-h .t{display:flex;gap:8px;align-items:center;justify-content:space-between}
.area-h h3{font-size:15.5px;font-weight:700}
.area-h .s{font-size:12.5px;color:var(--muted)}
.ppl{display:flex;flex-direction:column}
.p{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);align-items:center}
.p:last-child{border-bottom:0}
.p .nm{font-weight:600;font-size:14.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.p .dt{font-size:12.5px;color:var(--muted)}
.p a.num{font-family:var(--f-mono);font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.timebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.timebar input[type=time],.timebar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.clock{font-family:var(--f-display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}

/* roster */
.daytabs{display:flex;gap:6px;flex-wrap:wrap}
.daytab{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;line-height:1.25}
.daytab b{font-family:var(--f-display);font-size:15px}
.daytab span{font-size:12px;color:var(--muted)}
.daytab[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.scroll-x{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.rg{border-collapse:separate;border-spacing:0;width:100%;min-width:760px}
.rg th,.rg td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.rg tr>*:last-child{border-right:0}
.rg tbody tr:last-child>*{border-bottom:0}
.rg thead th{background:var(--surface-2);font-size:12px;font-weight:600}
.rg thead th .mono{font-size:13px;display:block;color:var(--fg)}
.rg tbody th{width:200px;font-size:13.5px;background:var(--surface-2)}
.rg tbody th small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.rc{display:flex;flex-direction:column;gap:6px}
.rp{display:flex;flex-direction:column;gap:1px;padding:5px 7px;border-radius:7px;background:var(--surface-2);font-size:13.5px;cursor:default;text-align:left;border:1px solid transparent}
.editing .rp{cursor:pointer;border-color:var(--line)}
.rp .top-l{display:flex;gap:6px;align-items:center;font-weight:600}
.rp .nt{font-size:12px;color:var(--muted)}
.rp a{font-family:var(--f-mono);font-size:12px;text-decoration:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}

/* dates */
.tl{display:flex;flex-direction:column;gap:10px}
.ev{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;align-items:start}
.ev.past{opacity:.72}
.ev.today{border-color:var(--sign);box-shadow:inset 4px 0 0 var(--sign)}
.ev .d{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;background:var(--surface-2);padding:6px 0;line-height:1.05}
.ev .d b{font-family:var(--f-display);font-size:24px;font-weight:800}
.ev .d span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ev h4{font-size:15.5px;font-weight:700}
.ev .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;font-size:13px;color:var(--muted);align-items:center}
.ev .att{font-size:13px;margin-top:6px}
.type{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:3px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.type.Milestone{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}

/* journeys */
.jcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.jc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.jc-h{background:linear-gradient(120deg,var(--accent),var(--plum));color:#fff;padding:10px 14px;font-family:var(--f-display);font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}
:root[data-theme="dark"] .jc-h{color:#160e20}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .jc-h{color:#160e20}}
.jc-h .iconbtn{width:28px;height:28px;background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:inherit}
.jc-b{padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.jc-b p{margin:0}
.jc-b ul,.jc-b ol{margin:0;padding-left:20px}
.hl{display:flex;gap:8px;align-items:center;background:var(--sign);color:var(--sign-ink);font-weight:600;padding:6px 10px;border-radius:6px;font-size:13.5px}
.charges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.chg{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:2px}
.chg b{font-family:var(--f-display);font-size:20px;font-weight:800;color:var(--accent)}
.chg span{font-size:12px;color:var(--muted);line-height:1.3}
.signs{display:flex;flex-direction:column;border-radius:6px;overflow:hidden;max-width:360px;background:var(--signdark)}
.sg{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:center;padding:8px 12px;font-weight:700;font-size:14.5px;border-bottom:1px solid rgba(0,0,0,.25)}
.sg .a{font-size:19px;line-height:1}
.sg small{display:block;font-weight:500;font-size:11.5px;opacity:.85}
.sg.yellow{background:#F2B21C;color:#17120B}
.sg.dark{background:#3B3540;color:#fff}
.sg.violet{background:#45307A;color:#fff}
.sg.plum{background:#7A1F55;color:#fff}
.vms{background:#121014;color:#E8B04A;font-family:var(--f-mono);font-weight:600;letter-spacing:.12em;text-align:center;padding:14px;border-radius:6px;white-space:pre-line;line-height:1.35;max-width:260px;text-shadow:0 0 6px rgba(232,176,74,.45)}

/* data */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart .vl{fill:var(--fg);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .peak{fill:var(--fg);font-weight:600}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.keyrow{display:flex;gap:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;align-items:center}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
table.sa{border-collapse:separate;border-spacing:0;min-width:1100px;width:100%;font-size:13px}
.sa th,.sa td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.sa th:first-child,.sa td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);white-space:normal;min-width:210px;max-width:250px;border-right:1px solid var(--line);z-index:1}
.sa thead th{background:var(--surface-2);font-weight:600;font-size:12px}
.sa thead th:first-child{background:var(--surface-2)}
.sa td.v{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.verify{font-size:10.5px;font-family:var(--f-mono);background:var(--warn-bg);color:var(--warn);padding:1px 5px;border-radius:3px;font-weight:600;white-space:nowrap}
.tiles{display:flex;gap:12px;flex-wrap:wrap}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:180px}
.tile b{font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--muted)}

/* images */
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.im{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.im button.th{border:0;padding:0;background:var(--surface-2);cursor:zoom-in;aspect-ratio:16/10;display:block;width:100%;max-width:100%}
.im button.th img{width:100%;height:100%;object-fit:contain;display:block}
.im .b{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.im h4{font-size:14.5px;font-weight:700}
.im p{margin:0;font-size:13px;color:var(--muted)}
.im .acts{display:flex;gap:6px;flex-wrap:wrap}
.lb{position:fixed;inset:0;z-index:60;background:#0C0910;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lb-bar{display:flex;gap:8px;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));color:#fff}
.lb-bar h4{flex:1;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-bar .iconbtn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.lb-view{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center}
.lb-view img{display:block;max-width:none;margin:auto}

/* partners */
.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pt h3{font-size:18px;font-weight:800;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pt .lnk{display:flex;gap:8px;align-items:center;font-size:13.5px;word-break:break-all}
.pt .lnk.missing{color:var(--warn)}
.pt ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.pt li{display:flex;justify-content:space-between;gap:10px;font-size:13px;align-items:center}
.pt li a{font-family:var(--f-mono);font-weight:600;text-decoration:none;white-space:nowrap}

/* modal & toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,10,20,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modal form{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:560px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal header h3{font-size:17px;font-weight:800}
.modal .fields{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>label,.fld>.lab{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld input[type=text],.fld input[type=tel],.fld input[type=url],.fld input[type=date],.fld input[type=time],.fld input[type=number],.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.fld textarea{min-height:90px;resize:vertical;font-family:var(--f-body)}
.fld textarea.code{font-family:var(--f-mono);font-size:12.5px;min-height:180px}
.fld .hint{font-size:12px;color:var(--muted)}
.fld.check{flex-direction:row;align-items:center;gap:8px}
.multi{display:flex;flex-direction:column;gap:4px}
.multi label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg);font-weight:500}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);max-width:min(92vw,520px)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);color:var(--fg);padding:10px 14px;border-radius:10px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.ct,.area,.ev,.jc,.im{transition:border-color .15s}}

/* ---- demo numbers ---- */
.demo-num{font-family:var(--f-mono);font-weight:600;color:var(--muted);white-space:nowrap}
.dial.off{background:var(--surface-2);color:var(--muted);cursor:default}
.dial.off:hover{filter:none}
/* ---- project info ---- */
.pinfo{display:flex;flex-direction:column}
.pi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.pi:first-child{border-top:0;padding-top:0}
.pi b{font-size:15px}
.pi p{margin:2px 0 0;white-space:pre-line}
/* ---- about card ---- */
.about-card{display:flex;flex-direction:column;gap:8px}
.about-card .lead{margin:0;font-size:15.5px;max-width:70ch}
.about-card details summary{cursor:pointer;font-weight:600;color:var(--accent);list-style:none;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.about-card details summary::-webkit-details-marker{display:none}
.about-card details summary::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s ease}
.about-card details[open] summary::after{transform:rotate(-135deg) translateY(-1px)}
.about-card details[open] summary .rm{display:none}
.about-card details:not([open]) summary .rl{display:none}
.about-card .more p{margin:8px 0 0;max-width:70ch}
/* ---- motion & touch ---- */
*{-webkit-tap-highlight-color:transparent}
.top{transition:box-shadow .2s ease}
.top.scrolled{box-shadow:0 4px 16px rgba(30,20,45,.08)}
@media (prefers-reduced-motion:no-preference){
  .wrap.enter{animation:tspRise .3s cubic-bezier(.2,.7,.2,1)}
  .sheet{animation:tspUp .3s cubic-bezier(.2,.8,.2,1)}
  .sheet.closing{animation:tspDown .2s ease forwards}
  .sheet-bg,.modal,.lb{animation:tspFade .2s ease}
  .sheet-bg.closing,.modal.closing,.lb.closing{animation:tspFadeOut .18s ease forwards}
  .modal form{animation:tspPop .26s cubic-bezier(.2,.8,.2,1)}
  .modal.closing form{animation:tspPopOut .18s ease forwards}
  .toast{animation:tspToast .25s cubic-bezier(.2,.8,.2,1)}
  .btn,.chip,.iconbtn,.dial,.qd,.tabbar a,.tabbar button,.daytab,.rp,.sheet a,.im button.th,.setup{transition:transform .12s ease,background-color .15s ease,border-color .15s ease,color .15s ease,filter .15s ease}
  .btn:active,.chip:active,.iconbtn:active,.dial:active,.qd:active,.daytab:active,.sheet a:active,.setup:active{transform:scale(.96)}
  .im button.th:active{transform:scale(.985)}
  .tabbar a:active,.tabbar button:active{transform:scale(.9)}
  .tabbar [aria-current="page"] .ico{animation:tspBump .32s ease}
  .about-card .more{animation:tspFade .25s ease}
  .pill.on .dot{animation:tspPulse 2s ease-in-out infinite}
}
@media (prefers-reduced-motion:no-preference) and (max-width:640px){
  .modal form{animation:tspUp .3s cubic-bezier(.2,.8,.2,1)}
  .modal.closing form{animation:tspDown .2s ease forwards}
}
@keyframes tspRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tspUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes tspDown{from{transform:none}to{transform:translateY(100%)}}
@keyframes tspFade{from{opacity:0}to{opacity:1}}
@keyframes tspFadeOut{from{opacity:1}to{opacity:0}}
@keyframes tspPop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes tspPopOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes tspToast{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes tspBump{50%{transform:translateY(-2px) scale(1.1)}}
@keyframes tspPulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---- phone-first additions ---- */
.ct-num{display:none}
.proj .setup{display:flex;gap:8px;align-items:center;border:1px dashed rgba(255,255,255,.5);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.08);color:inherit;cursor:pointer;font-weight:600;text-align:left}
.rlist,.sa-m{display:none}
.rl-area{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rl-area>h3{font-size:15.5px;font-weight:700;padding:12px 14px 2px}
.rl-area>.s{font-size:13px;color:var(--muted);padding:0 14px 10px;border-bottom:1px solid var(--line)}
.rl-shift{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.rl-shift:last-child{border-bottom:0}
.rl-shift .tm{font-family:var(--f-mono);font-weight:600;font-size:13.5px;padding-top:4px;white-space:pre-line;line-height:1.3}
.ct-num .iconbtn{width:34px!important;height:34px!important}
.rl-shift .rc{gap:6px}
.shared{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.sa-m .mrow{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.sa-m .mrow:last-child{border-bottom:0}
.sa-m .mn{font-size:14px;line-height:1.3}
.sa-m .mv{font-family:var(--f-mono);font-weight:600;text-align:right;font-size:14px}
.sa-m .mb{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.sa-m .mb i{display:block;height:100%;background:var(--accent);border-radius:3px}
.lb-view{flex:1;overflow:auto;display:block;touch-action:none;cursor:grab}
.lb-view img{margin:0 auto;user-select:none;-webkit-user-drag:none}
.lb-hint{color:rgba(255,255,255,.7);font-size:12.5px;text-align:center;padding:6px 16px 10px}
@media (max-width:900px){
  .hero{display:contents}
  .ov-proj{order:0}.ov-info{order:1}.ov-about{order:2}.ov-notices{order:3}.ov-quick{order:4}.ov-dates{order:5}.ov-more{order:6}
  .cbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,57px));z-index:12;background:var(--bg);padding-block:8px;margin-block:-8px;display:flex;flex-direction:column;gap:8px}
  .chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips.scroll::-webkit-scrollbar{display:none}
  .chips.scroll .chip{flex:none}
  .rg-wrap{display:none}
  .rlist{display:flex;flex-direction:column;gap:12px}
  .sa-wrap{display:none}
  .sa-m{display:block}
}
@media (max-width:640px){
  body{font-size:16px}
  .fld input,.fld select,.fld textarea,.search input,.timebar input,.timebar select,.sa-m select{font-size:16px}
  .phead h2{font-size:23px}
  .phead p{font-size:14.5px}
  .wrap{gap:18px}
  .ct-role,.ct-esc,.p .dt,.area-h .s,.ev .meta,.ev .att,.im p,.pt li,.legend,.keyrow{font-size:14px}
  .muted[style*="font-size:12"]{font-size:13.5px!important}
  /* contacts: compact rows with a big call button */
  .ct{grid-template-columns:minmax(0,1fr) auto;padding:12px;gap:4px 12px;align-items:start}
  .ct-name{font-size:16px}
  .ct-num{display:flex;align-items:center;gap:8px;margin-top:6px}
  .ct-num a{font-family:var(--f-mono);font-weight:600;font-size:16px;color:var(--fg);text-decoration:none}
  .ct-meta{margin-top:5px}
  .dialbox{flex-direction:column;justify-content:flex-start;gap:6px}
  .dial{width:52px;height:52px;padding:0;justify-content:center;border-radius:50%}
  .dial .dn{display:none}
  .dial .ico{width:24px;height:24px}
  .dialbox>.iconbtn[data-act="copy"]{display:none}
  /* overview */
  .proj{padding:16px;gap:12px}
  .proj h2{font-size:22px}
  .live .big{font-size:34px}
  .quick{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .qd{padding:12px;min-height:84px}
  .qd .r{font-size:14px}
  .qd .n{font-size:15px}
  /* who's on */
  .timebar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
  .timebar .tb-clock{grid-column:1/-1}
  .timebar .tb-day{grid-column:1/-1;display:flex;flex-direction:column;align-items:stretch;gap:4px}
  .timebar .tb-time{display:flex;flex-direction:column;align-items:stretch;gap:4px}
  .timebar .tb-day select,.timebar .tb-time input{width:100%;padding:10px}
  .timebar [data-act="wnow"]{align-self:end;padding:11px 16px}
  .p{padding:11px 14px}
  .p a.num{font-size:15px;padding:6px 0}
  /* dates */
  .ev{grid-template-columns:54px minmax(0,1fr) auto;gap:12px;padding:12px}
  .ev .d b{font-size:21px}
  /* forms as bottom sheets */
  .modal{padding:0;align-items:flex-end}
  .modal form{max-width:none;border-radius:18px 18px 0 0;max-height:94vh;overflow:auto}
  .modal header{position:sticky;top:0;background:var(--surface);z-index:1}
  .modal footer{position:sticky;bottom:0;background:var(--surface);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .modal footer .btn{padding:11px 16px;font-size:15px}
  .iconbtn{width:40px;height:40px}
  .chip{padding:8px 13px;font-size:14px}

 if(/^07\d{9}$/.test(d))return d.slice(0,5)+' '+d.slice(5);
 if(/^02\d{9}$/.test(d))return d.slice(0,3)+' '+d.slice(3,7)+' '+d.slice(7);

var DEMO_DIAL='07700900111';
function isDemo(p){return /demo/i.test(String(p||''));}

function toMin(t){var m=/^(\d{1,2})[:.](\d{2})$/.exec(String(t).trim());return m?(+m[1])*60+(+m[2]):null;}
function parseShift(s){if(!s)return null;s=String(s).trim();if(/24\s*h/i.test(s))return[0,1440];var p=s.split(/\s*[-–—]\s*/);if(p.length!==2)return null;var a=toMin(p[0]),b=toMin(p[1]);if(a==null||b==null)return null;return[a,b];}
function onAt(s,m){var r=parseShift(s);if(!r)return null;if(r[0]===0&&r[1]===1440)return true;return r[1]>r[0]?(m>=r[0]&&m<r[1]):(m>=r[0]||m<r[1]);}
function fmtShift(s){var r=parseShift(s);if(!r)return s||'';if(r[0]===0&&r[1]===1440)return '24 hrs';return hm(r[0])+'–'+hm(r[1]%1440===0&&r[1]!==0?r[1]:r[1]);}

function readImage(file){return new Promise(function(res,rej){
 if(!file||!/^image\//.test(file.type)){rej(new Error('Not an image'));return;}
 var fr=new FileReader();fr.onerror=function(){rej(fr.error);};
 fr.onload=function(){var url=fr.result;if(file.type==='image/svg+xml'||file.size<350000){res(url);return;}
  var img=new Image();img.onload=function(){var max=2200,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,max/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.86));};img.onerror=function(){res(url);};img.src=url;};
 fr.readAsDataURL(file);});}
function addFiles(files,replaceIm){files=[].slice.call(files||[]).filter(function(f){return /^image\//.test(f.type);});if(!files.length){toast('Choose an image file (JPG, PNG or SVG).');return;}
 Promise.all(files.map(readImage)).then(function(urls){
  if(replaceIm){replaceIm.src=urls[0];toast('Image replaced. Press Save to keep it.');}
  else{urls.forEach(function(u,i){S.images.push({id:uid(),title:files[i].name.replace(/\.[^.]+$/,''),category:ui.imgCat!=='All'?ui.imgCat:'Maps',caption:'',src:u});});toast(urls.length+' image'+(urls.length>1?'s':'')+' added. Press Save to keep '+(urls.length>1?'them':'it')+'.');}
  markDirty();render();}).catch(function(e){toast('Couldn’t read that image: '+e.message);});}

function sortDates(a,b){var x=(a.date||'')+(a.time||'00'),y=(b.date||'')+(b.time||'00');return x<y?-1:x>y?1:0;}
function activeNotices(){var t=todayISO();return S.notices.filter(function(n){return !n.until||n.until>=t;}).sort(function(a,b){if(!!b.pinned!==!!a.pinned)return b.pinned?1:-1;var L={critical:0,advisory:1,info:2};if(L[a.level]!==L[b.level])return L[a.level]-L[b.level];return (b.date||'')<(a.date||'')?-1:1;});}
function noticeHtml(n){var t=todayISO(),exp=n.until&&n.until<t;return '<article class="notice '+esc(n.level)+'"'+(exp?' style="opacity:.6"':'')+'><span class="bar"></span><div style="min-width:0"><h4><span class="lvl '+esc(n.level)+'">'+esc(n.level)+'</span>'+esc(n.title)+(n.pinned?' <span class="pill">Pinned</span>':'')+'</h4><p>'+linkify(n.body)+'</p><div class="muted" style="font-size:12px;margin-top:6px">'+(n.date?'From '+fmtDate(n.date):'')+(n.until?' until '+fmtDate(n.until):'')+(exp?' · expired':'')+'</div></div><div><button class="iconbtn" data-act="notice-edit" data-id="'+n.id+'" aria-label="Edit notice">'+ic('edit')+'</button></div></article>';}

V.data=function(){var F=S.forecast;if(!F.days[ui.fDay])ui.fDay=0;var d=F.days[ui.fDay];
 var h=phead('Forecast & data','T4 passenger forecasts for the closure days and the surface access profile.','');
 h+='<section class="sec"><h3>Passenger forecast<span class="spacer"></span><button class="btn sm edit-only" data-act="fc-edit">'+ic('edit')+' Edit '+esc(d?d.label:'')+'</button><button class="btn sm edit-only" data-act="fc-add">'+ic('plus')+' Add day</button></h3><div class="chips">'+F.days.map(function(x,i){return '<button class="chip" data-act="fday" data-v="'+i+'" aria-pressed="'+(i===ui.fDay)+'">'+esc(x.label)+'</button>';}).join('')+'</div>';
 if(d){h+='<div class="grid2">'+chartCard('Immigration','Hourly local arriving passengers at the immigration hall',d.immigration,F)+chartCard('Check-in','Hourly direct passengers at check-in',d.checkin,F)+'</div>';}
 h+='<div class="keyrow"><span><span class="sw" style="background:var(--ok)"></span>Under '+F.amber.toLocaleString()+'/hr</span><span><span class="sw" style="background:var(--warn)"></span>'+F.amber.toLocaleString()+'–'+(F.red-1).toLocaleString()+'/hr</span><span><span class="sw" style="background:var(--crit)"></span>'+F.red.toLocaleString()+'+/hr</span><span>'+esc(F.note||'')+'</span></div></section>';
 var A=S.surface;
 h+='<section class="sec"><h3>Terminal 4 surface access profile<span class="spacer"></span><button class="btn sm edit-only" data-act="sa-edit">'+ic('edit')+' Edit table</button></h3><div class="tiles">'+A.tiles.map(function(t){return '<div class="tile"><b>'+esc(t.value)+'</b><span>'+esc(t.label)+(t.verify?' <span class="verify">check</span>':'')+'</span></div>';}).join('')+'</div>';
 var mi=ui.saMonth==null||ui.saMonth>=A.months.length?A.months.length-1:ui.saMonth;
 var mrows=A.rows.map(function(r){return{r:r,v:r.vals[mi]};}).sort(function(a,b){return (b.v||0)-(a.v||0);});var mmax=Math.max.apply(null,mrows.map(function(x){return x.v||0;}))||1;
 h+='<div class="card sa-m"><label class="fld"><span class="lab">Month</span><select id="samonth">'+A.months.map(function(m,i){return '<option value="'+i+'"'+(i===mi?' selected':'')+'>'+esc(m)+'</option>';}).join('')+'</select></label>'+
  mrows.map(function(x){return '<div class="mrow"><span class="mn">'+esc(x.r.mode)+(x.r.verify?' <span class="verify">check</span>':'')+'</span><span class="mv">'+(x.v==null?'–':x.v.toFixed(1)+'%')+'</span><span class="mb"><i style="width:'+((x.v||0)/mmax*100).toFixed(1)+'%"></i></span></div>';}).join('')+'</div>';
 h+='<div class="scroll-x sa-wrap"><table class="sa"><thead><tr><th>Mode of transport</th>'+A.months.map(function(m){return '<th>'+esc(m)+'</th>';}).join('')+'</tr></thead><tbody>'+A.rows.map(function(r){return '<tr><td>'+esc(r.mode)+(r.verify?' <span class="verify">check</span>':'')+'</td>'+r.vals.map(function(v){return '<td class="v"'+(v!=null?' style="background:color-mix(in srgb,var(--accent) '+Math.min(55,Math.round(v*1.8))+'%,transparent)'+(v>=20?';font-weight:600':'')+'"':'')+'>'+(v==null?'<span class="muted">–</span>':v.toFixed(1)+'%')+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div><p class="muted" style="margin:0;font-size:12.5px">Shading shows share of passengers by mode. Rows marked “check” were hard to read in the source and need confirming.</p></section>';
 return h;};
function chartCard(title,sub,series,F){var vals=series.values||[],st=series.start||0;if(!vals.length)return '<div class="card"><h4>'+esc(title)+'</h4><div class="empty-note">No values yet.</div></div>';
 var max=Math.max.apply(null,vals),pk=vals.indexOf(max),tot=vals.reduce(function(a,b){return a+b;},0);
 var W=640,H=250,L=40,R=8,T=22,B=26,cw=W-L-R,ch=H-T-B,ym=Math.ceil(max/500)*500||500,bw=cw/vals.length;
 var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(title)+' passengers per hour">';
 for(var g=0;g<=ym;g+=500){var y=T+ch-ch*g/ym;s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+(g/1000).toFixed(1)+'k</text>';}
 vals.forEach(function(v,i){var bh=ch*v/ym,x=L+i*bw+2,y=T+ch-bh,col=v>=F.red?'var(--crit)':v>=F.amber?'var(--warn)':'var(--ok)';
  s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-4).toFixed(1)+'" height="'+Math.max(bh,1).toFixed(1)+'" rx="2" fill="'+col+'"><title>'+hm((st+i)*60)+' · '+v.toLocaleString()+' pax</title></rect>';
  if(bw>=26||i===pk)s+='<text class="vl'+(i===pk?' peak':'')+'" x="'+(x+(bw-4)/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle">'+v.toLocaleString()+'</text>';
  if((st+i)%3===0)s+='<text x="'+(x+(bw-4)/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+String((st+i)%24).padStart(2,'0')+':00</text>';});
 s+='</svg>';
 return '<div class="card sec"><div><h4 style="font-size:15px">'+esc(title)+'</h4><div class="muted" style="font-size:12.5px">'+esc(sub)+'</div></div><div class="stats"><div class="stat"><b>'+max.toLocaleString()+'</b><span>Peak · '+hm((st+pk)*60)+'</span></div><div class="stat"><b>'+tot.toLocaleString()+'</b><span>Total, '+hm(st*60)+'–'+hm((st+vals.length)*60)+'</span></div><div class="stat"><b>'+vals.filter(function(v){return v>=F.red;}).length+'</b><span>Red hours</span></div></div>'+s+'</div>';}

V.maps=function(){var cats=['All'];S.images.forEach(function(i){if(i.category&&cats.indexOf(i.category)<0)cats.push(i.category);});if(cats.indexOf(ui.imgCat)<0)ui.imgCat='All';
 var list=S.images.filter(function(i){return ui.imgCat==='All'||i.category===ui.imgCat;});

 '<div class="imgs">'+list.map(function(im){var i=S.images.indexOf(im);return '<article class="im"><button class="th" data-act="img-open" data-id="'+im.id+'" aria-label="View '+esc(im.title)+'"><img src="'+im.src+'" alt="'+esc(im.title)+'" loading="lazy"></button><div class="b"><h4>'+esc(im.title)+'</h4>'+(im.caption?'<p>'+esc(im.caption)+'</p>':'')+'<div class="acts"><span class="pill">'+esc(im.category||'Other')+'</span><span class="spacer"></span><button class="btn sm" data-act="img-replace" data-id="'+im.id+'">'+ic('swap')+' Replace</button><button class="iconbtn" data-act="img-edit" data-id="'+im.id+'" aria-label="Edit details">'+ic('edit')+'</button>'+(i>0?'<button class="iconbtn" data-act="img-up" data-id="'+im.id+'" aria-label="Move earlier">'+ic('up')+'</button>':'')+'</div></div></article>';}).join('')+'</div>'+
 '<div class="drop" id="drop">'+ic('image')+'<span>Drop images here, paste from your clipboard, or</span><button class="btn sm" data-act="img-add">Choose files</button></div>';};

V.partners=function(){return phead('Delivery partners','Partner infographics and the numbers that belong to each partner.','<button class="btn edit-only" data-act="partner-add">'+ic('plus')+' Add partner</button>')+
 '<div class="grid3">'+S.partners.map(function(p){var mt=(p.match||p.name||'').toLowerCase();var rel=mt?S.contacts.filter(function(c){return digits(c.phone)&&((c.role||'')+' '+(c.dept||'')).toLowerCase().indexOf(mt)>=0;}):[];var seen={};rel=rel.filter(function(c){var k=c.role+c.phone;if(seen[k])return false;seen[k]=1;return true;});

  (p.url?'<a class="lnk" href="'+esc(p.url)+'" target="_blank" rel="noopener">'+ic('link')+esc(p.name)+' infographic</a>':'<span class="lnk missing">'+ic('link')+'Link to add</span>')+
  (rel.length?'<ul>'+rel.map(function(c){return '<li><span>'+esc(c.name||c.role)+'</span>'+tel(c.phone)+'</li>';}).join('')+'</ul>':'')+'</article>';}).join('')+'</div>';};

/* ---------- events ---------- */
function byId(arr,id){return (arr||[]).find(function(x){return x.id===id;});}
document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t)return;var a=t.getAttribute('data-act'),v=t.getAttribute('data-v'),id=t.getAttribute('data-id');
 switch(a){
 case 'nav':e.preventDefault();closeSheet();go(v);break;
 case 'edit-toggle':editing=!editing;render();toast(editing?'Edit mode on. Tap the pencil on anything to change it.':'Edit mode off.'+(dirty?' Remember to Save.':''));break;
 case 'save':save();break;
 case 'pinfo-add':pinfoForm();break;
 case 'pinfo-edit':pinfoForm(byId(S.projectInfo,id));break;
 case 'feedback':feedback();break;
 case 'copy':copyText(v);break;
 case 'mclose':closeForm();break;
 case 'mdel':if(t.dataset.confirm){FORM.onDelete();closeForm();markDirty();render();toast('Deleted. Press Save to publish.');}else{t.dataset.confirm='1';t.querySelector('span').textContent='Confirm delete';}break;
 case 'proj-edit':projectForm();break;
 case 'notice-add':noticeForm();break;
 case 'notice-edit':noticeForm(byId(S.notices,id));break;
 case 'todo-add':todoForm();break;
 case 'todo-edit':todoForm(byId(S.todo,id));break;
 case 'todo-tick':var td=byId(S.todo,id);if(td){td.done=t.checked;markDirty();render();}break;
 case 'cgroup':ui.cGroup=v;saveUi();render();break;
 case 'conow':ui.cOnNow=!ui.cOnNow;saveUi();render();break;
 case 'contact-add':contactForm();break;
 case 'contact-edit':contactForm(byId(S.contacts,id));break;
 case 'wnow':ui.wTime=null;render();break;
 case 'rday':ui.rDay=v;saveUi();render();break;
 case 'rday-add':dayForm();break;
 case 'rday-edit':dayForm(byId(S.rosterDays,id));break;
 case 'roster-add':rosterForm(null,ui.rDay);break;
 case 'roster-edit':if(editing)rosterForm(byId(S.roster,id));break;
 case 'date-add':dateForm();break;
 case 'date-edit':dateForm(byId(S.dates,id));break;
 case 'journey-add':journeyForm();break;
 case 'journey-edit':journeyForm(byId(S.journeys,id));break;
 case 'charges-edit':chargesForm();break;
 case 'signs-edit':signsForm();break;
 case 'fday':ui.fDay=+v;saveUi();render();break;
 case 'fc-edit':forecastForm(ui.fDay);break;
 case 'fc-add':var last=S.forecast.days[S.forecast.days.length-1];S.forecast.days.push({label:'New day',date:'',immigration:{start:last?last.immigration.start:6,values:[]},checkin:{start:last?last.checkin.start:4,values:[]}});ui.fDay=S.forecast.days.length-1;forecastForm(ui.fDay);break;
 case 'sa-edit':surfaceForm();break;
 case 'imgcat':ui.imgCat=v;saveUi();render();break;
 case 'img-add':pickFile(null);break;
 case 'img-replace':pickFile(byId(S.images,id));break;
 case 'img-edit':imageForm(byId(S.images,id));break;
 case 'img-up':var ix=S.images.findIndex(function(x){return x.id===id;});if(ix>0){var tmp=S.images[ix-1];S.images[ix-1]=S.images[ix];S.images[ix]=tmp;markDirty();render();}break;
 case 'img-open':openLB(byId(S.images,id));break;
 case 'lbz':var n=+v;zoomLB(n===0?1:LB.z*(n>0?1.5:1/1.5));break;
 case 'more':openSheet();break;
 case 'sheet-close':closeSheet();break;
 case 'lbclose':fadeRemove(document.getElementById('lb'),190);break;
 case 'partner-add':partnerForm();break;
 case 'partner-edit':partnerForm(byId(S.partners,id));break;
 case 'draft-restore':S=pendingDraft.data;ensureIds();pendingDraft=null;dirty=true;render();toast('Restored. Press Save to publish them.');break;
 case 'draft-discard':pendingDraft=null;try{localStorage.removeItem('tsp-draft');}catch(err){}render();break;
 }});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(document.getElementById('sheet'))closeSheet();else if(document.getElementById('lb'))fadeRemove(document.getElementById('lb'),190);else closeForm();}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click();}});
document.addEventListener('input',function(e){if(e.target.id==='csearch'){ui.cQuery=e.target.value;document.getElementById('clist').innerHTML=contactList();}});

document.addEventListener('paste',function(e){if(ui.view!=='maps'||document.getElementById('modal'))return;var fs=[].slice.call((e.clipboardData&&e.clipboardData.files)||[]);if(fs.length){e.preventDefault();addFiles(fs);}});
window.addEventListener('resize',function(){if(document.getElementById('lb'))sizeLB();});
window.addEventListener('beforeunload',function(e){if(dirty&&ART&&canPublish){e.preventDefault();e.returnValue='';}});
function copyText(s){function fb(){toast('Number: '+s);}try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(function(){toast('Copied '+s);},fb);}else fb();}catch(err){fb();}}
var VALID=VIEWS.map(function(v){return v[0];});
function go(v){if(VALID.indexOf(v)<0)v='overview';ui.view=v;if(location.hash!=='#'+v){try{history.replaceState(null,'','#'+v);}catch(e){location.hash=v;}}render();window.scrollTo(0,0);}
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(h&&h!==ui.view&&VALID.indexOf(h)>=0){ui.view=h;render();}});
(function init(){var h=location.hash.slice(1);if(VALID.indexOf(h)>=0)ui.view=h;render();useClaude();})();
})();
